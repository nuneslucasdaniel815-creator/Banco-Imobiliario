<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Banco Imobiliário - Maquininha Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Chakra Petch', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #090d16;
        }
        .digital-font {
            font-family: 'Chakra Petch', monospace;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .btn-active:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-blue-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-slate-900/95 border-b border-slate-800 p-3 sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-credit-card text-white text-base"></i>
                </div>
                <div>
                    <h1 class="font-display font-bold text-base tracking-wider bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent leading-none">
                        SUPER BANCO
                    </h1>
                    <span class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Maquininha Digital</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="openCardModal()" class="px-2.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition btn-active">
                    <i class="fa-solid fa-dice text-amber-400"></i>
                    <span>Sorte/Revés</span>
                </button>
                <button onclick="openHistoryModal()" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg flex items-center justify-center transition btn-active" title="Histórico">
                    <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                </button>
                <button onclick="openSettingsModal()" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg flex items-center justify-center transition btn-active" title="Configurações">
                    <i class="fa-solid fa-gear text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal da Maquininha -->
    <main class="max-w-md mx-auto w-full p-3 flex-1 flex flex-col gap-3">

        <!-- Display Digital de Entrada -->
        <div class="bg-slate-900 border-2 border-slate-700/80 rounded-2xl p-3.5 shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-1 text-xs text-slate-400 font-medium">
                <span class="uppercase tracking-wider text-blue-400 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-circle text-[7px] animate-pulse"></i> Visor Operacional
                </span>
                <button onclick="clearNumpad()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold flex items-center gap-1 bg-rose-950/40 px-2 py-0.5 rounded border border-rose-800/40">
                    <i class="fa-solid fa-eraser"></i> Limpar
                </button>
            </div>

            <!-- Visor do Valor -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-2 flex items-center justify-between shadow-inner">
                <span class="text-slate-500 font-display text-lg font-bold">R$</span>
                <span id="display-value" class="digital-font text-3xl font-bold text-emerald-400 tracking-wider truncate pl-2">0</span>
            </div>

            <!-- Botões Rápidos de Valor (+ e -) -->
            <div class="space-y-1">
                <div class="flex items-center justify-between text-[10px] uppercase tracking-wider font-bold text-slate-400 px-1">
                    <span class="text-emerald-400"><i class="fa-solid fa-plus text-[8px]"></i> Incrementar</span>
                    <span class="text-rose-400"><i class="fa-solid fa-minus text-[8px]"></i> Decrementar</span>
                </div>
                
                <div class="grid grid-cols-4 gap-1">
                    <button onclick="addQuickValue(100)" class="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-300 text-xs py-1.5 rounded-lg font-bold border border-emerald-800/40 btn-active">+100</button>
                    <button onclick="addQuickValue(-100)" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs py-1.5 rounded-lg font-bold border border-rose-800/40 btn-active">-100</button>
                    <button onclick="addQuickValue(200)" class="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-300 text-xs py-1.5 rounded-lg font-bold border border-emerald-800/40 btn-active">+200</button>
                    <button onclick="addQuickValue(-200)" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs py-1.5 rounded-lg font-bold border border-rose-800/40 btn-active">-200</button>
                </div>

                <div class="grid grid-cols-4 gap-1">
                    <button onclick="addQuickValue(500)" class="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-300 text-xs py-1.5 rounded-lg font-bold border border-emerald-800/40 btn-active">+500</button>
                    <button onclick="addQuickValue(-500)" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs py-1.5 rounded-lg font-bold border border-rose-800/40 btn-active">-500</button>
                    <button onclick="addQuickValue(1000)" class="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-300 text-xs py-1.5 rounded-lg font-bold border border-emerald-800/40 btn-active">+1K</button>
                    <button onclick="addQuickValue(-1000)" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs py-1.5 rounded-lg font-bold border border-rose-800/40 btn-active">-1K</button>
                </div>

                <div class="grid grid-cols-4 gap-1">
                    <button onclick="addQuickValue(5000)" class="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-300 text-xs py-1.5 rounded-lg font-bold border border-emerald-800/40 btn-active">+5K</button>
                    <button onclick="addQuickValue(-5000)" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs py-1.5 rounded-lg font-bold border border-rose-800/40 btn-active">-5K</button>
                    <button onclick="addQuickValue(10000)" class="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-300 text-xs py-1.5 rounded-lg font-bold border border-emerald-800/40 btn-active">+10K</button>
                    <button onclick="addQuickValue(-10000)" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs py-1.5 rounded-lg font-bold border border-rose-800/40 btn-active">-10K</button>
                </div>
            </div>
        </div>

        <!-- Teclado Numérico da Maquininha -->
        <div class="grid grid-cols-3 gap-1.5 bg-slate-900 border border-slate-800 rounded-2xl p-2.5 shadow-xl">
            <button onclick="pressNumpad('1')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">1</button>
            <button onclick="pressNumpad('2')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">2</button>
            <button onclick="pressNumpad('3')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">3</button>
            <button onclick="pressNumpad('4')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">4</button>
            <button onclick="pressNumpad('5')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">5</button>
            <button onclick="pressNumpad('6')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">6</button>
            <button onclick="pressNumpad('7')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">7</button>
            <button onclick="pressNumpad('8')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">8</button>
            <button onclick="pressNumpad('9')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">9</button>
            <button onclick="pressNumpad('00')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-display font-bold text-sm py-3 rounded-xl border border-slate-700/60 btn-active">00</button>
            <button onclick="pressNumpad('0')" class="bg-slate-800 hover:bg-slate-700 text-white font-display font-bold text-xl py-3 rounded-xl border border-slate-700/60 btn-active">0</button>
            <button onclick="pressNumpad('000')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-display font-bold text-sm py-3 rounded-xl border border-slate-700/60 btn-active">000</button>
        </div>

        <!-- Seletor de Pagador / Recebedor & Botão Confirmar -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-rose-400 mb-1">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i> Pagador (De)
                    </label>
                    <select id="select-payer" class="w-full bg-slate-950 border border-slate-700 text-white text-xs rounded-xl p-2.5 font-semibold focus:outline-none focus:border-rose-500">
                        <!-- Gerado via JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-emerald-400 mb-1">
                        <i class="fa-solid fa-arrow-down-to-bracket"></i> Recebedor (Para)
                    </label>
                    <select id="select-receiver" class="w-full bg-slate-950 border border-slate-700 text-white text-xs rounded-xl p-2.5 font-semibold focus:outline-none focus:border-emerald-500">
                        <!-- Gerado via JS -->
                    </select>
                </div>
            </div>

            <button onclick="executeTransaction()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 btn-active transition">
                <i class="fa-solid fa-check-double text-base"></i> CONFIRMAR TRANSAÇÃO
            </button>
        </div>

        <!-- Cards dos Jogadores -->
        <div>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 px-1 flex items-center justify-between">
                <span><i class="fa-solid fa-users text-blue-400 mr-1"></i> Jogadores na Mesa</span>
                <span class="text-[10px] text-slate-500 font-normal">Toque no card para ações rápidas</span>
            </h2>
            <div id="players-grid" class="grid grid-cols-2 gap-2">
                <!-- Gerado via JS -->
            </div>
        </div>

    </main>

    <!-- Modal de Ações do Jogador -->
    <div id="player-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-4 shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                    <div id="modal-player-badge" class="w-7 h-7 rounded-lg flex items-center justify-center text-white font-bold text-xs"></div>
                    <div>
                        <h3 id="modal-player-name" class="font-bold text-sm text-white"></h3>
                        <span id="modal-player-balance" class="digital-font text-xs text-emerald-400 font-bold"></span>
                    </div>
                </div>
                <button onclick="closePlayerModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="space-y-2 py-1">
                <button onclick="quickPassStart()" class="w-full py-2.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl text-xs font-bold flex items-center justify-center gap-2 btn-active">
                    <i class="fa-solid fa-flag-checkered text-amber-400"></i> Passar no Início (+R$ <span id="modal-start-bonus">2.000</span>)
                </button>
                <button onclick="selectAsPayerFromModal()" class="w-full py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 rounded-xl text-xs font-bold flex items-center justify-center gap-2 btn-active">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i> Definir como Pagador
                </button>
                <button onclick="selectAsReceiverFromModal()" class="w-full py-2 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-bold flex items-center justify-center gap-2 btn-active">
                    <i class="fa-solid fa-arrow-down-to-bracket"></i> Definir como Recebedor
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Cartas de Sorte ou Revés -->
    <div id="card-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-4 shadow-2xl flex flex-col items-center text-center gap-3">
            <div class="flex justify-between items-center w-full border-b border-slate-800 pb-2">
                <span class="text-xs font-bold text-amber-400 tracking-wider uppercase flex items-center gap-1.5">
                    <i class="fa-solid fa-dice"></i> Carta de Sorte ou Revés
                </span>
                <button onclick="closeCardModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div id="chance-card" class="w-full min-h-[180px] bg-gradient-to-b from-slate-800 to-slate-950 border border-amber-500/40 rounded-xl p-4 flex flex-col justify-between items-center relative shadow-inner">
                <div id="card-type-badge" class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-amber-500/20 text-amber-300 border border-amber-500/30">
                    Sorte / Revés
                </div>

                <div class="my-auto py-2">
                    <p id="card-text" class="text-sm font-semibold text-slate-100 leading-relaxed">
                        Pressione o botão para tirar uma carta do baralho!
                    </p>
                    <p id="card-value-display" class="text-xl font-bold font-display text-emerald-400 mt-2 hidden"></p>
                </div>

                <div class="text-[10px] text-slate-500 font-medium">
                    Super Banco Imobiliário
                </div>
            </div>

            <div class="w-full flex flex-col gap-2">
                <button onclick="drawChanceCard()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold text-xs rounded-xl shadow-lg shadow-amber-500/20 btn-active">
                    <i class="fa-solid fa-shuffle mr-1"></i> Tirar Nova Carta
                </button>
                <button id="btn-apply-card" onclick="applyCardEffect()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl hidden btn-active">
                    <i class="fa-solid fa-check mr-1"></i> Jogar Valor para o Visor
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Histórico -->
    <div id="history-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-4 shadow-2xl flex flex-col gap-3 max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Histórico de Transações
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div id="history-list" class="flex flex-col gap-2 overflow-y-auto pr-1 my-1 flex-1 min-h-[200px]">
                <!-- Gerado via JS -->
            </div>

            <div class="flex gap-2 border-t border-slate-800 pt-2">
                <button onclick="undoLastTransaction()" class="w-full py-2.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-xl text-xs font-bold btn-active flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-rotate-left"></i> Desfazer Última Transação
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Configurações -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-4 shadow-2xl flex flex-col gap-3 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-400"></i> Configurações da Partida
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Saldo Inicial de Cada Jogador (R$)</label>
                    <input type="number" id="input-initial-balance" value="25000" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white font-display text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Valor do Ponto de Partida (R$)</label>
                    <input type="number" id="input-start-bonus" value="2000" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white font-display text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Gerenciar Jogadores na Mesa</label>
                    <div id="settings-players-list" class="space-y-1.5">
                        <!-- Gerado via JS -->
                    </div>
                </div>
            </div>

            <div class="flex gap-2 border-t border-slate-800 pt-2">
                <button onclick="saveSettings()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs btn-active">
                    Salvar Alterações
                </button>
                <button onclick="resetGame()" class="py-2.5 px-3 bg-rose-600/20 border border-rose-500/40 hover:bg-rose-600/40 text-rose-300 font-bold rounded-xl text-xs btn-active" title="Reiniciar Partida">
                    <i class="fa-solid fa-power-off"></i> Reiniciar
                </button>
            </div>
        </div>
    </div>

    <!-- Toast de Notificações -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-full max-w-xs px-2"></div>

    <!-- Script Principal sem bugs -->
    <script>
        const COLOR_MAP = {
            amarelo: { name: 'Amarelo', bg: 'bg-yellow-500', text: 'text-yellow-400', border: 'border-yellow-500' },
            verde: { name: 'Verde', bg: 'bg-emerald-500', text: 'text-emerald-400', border: 'border-emerald-500' },
            azul: { name: 'Azul', bg: 'bg-blue-500', text: 'text-blue-400', border: 'border-blue-500' },
            vermelho: { name: 'Vermelho', bg: 'bg-red-500', text: 'text-red-400', border: 'border-red-500' },
            roxo: { name: 'Roxo', bg: 'bg-purple-500', text: 'text-purple-400', border: 'border-purple-500' },
            preto: { name: 'Preto', bg: 'bg-slate-500', text: 'text-slate-300', border: 'border-slate-500' }
        };

        let config = {
            initialBalance: 25000,
            startBonus: 2000
        };

        let players = [
            { id: '1', name: 'Amarelo', color: 'amarelo', balance: 25000, active: true },
            { id: '2', name: 'Verde', color: 'verde', balance: 25000, active: true },
            { id: '3', name: 'Azul', color: 'azul', balance: 25000, active: true },
            { id: '4', name: 'Vermelho', color: 'vermelho', balance: 25000, active: true },
            { id: '5', name: 'Roxo', color: 'roxo', balance: 25000, active: false },
            { id: '6', name: 'Preto', color: 'preto', balance: 25000, active: false }
        ];

        let history = [];
        let currentInputValue = "0";
        let selectedModalPlayerId = null;
        let drawnCard = null;

        const chanceCards = [
            { text: "Sua ação na Bolsa de Valores valorizou! Receba do Banco.", value: 2500, type: 'sorte' },
            { text: "Imposto de Renda atrasado. Pague ao Banco.", value: -1500, type: 'reves' },
            { text: "Você ganhou o concurso de startups! Receba do Banco.", value: 3000, type: 'sorte' },
            { text: "Sua propriedade precisou de reformas de emergência. Pague ao Banco.", value: -2000, type: 'reves' },
            { text: "Herança inesperada de um parente distante! Receba do Banco.", value: 5000, type: 'sorte' },
            { text: "Multa por excesso de velocidade na avenida. Pague ao Banco.", value: -500, type: 'reves' },
            { text: "Rendimentos de investimentos imobiliários. Receba do Banco.", value: 1000, type: 'sorte' },
            { text: "Seguro do carro venceu. Pague ao Banco.", value: -1000, type: 'reves' }
        ];

        window.onload = function() {
            loadFromLocalStorage();
            renderPlayers();
            updateSelectOptions();
            updateDisplay();
            renderSettingsList();
        };

        function updateDisplay() {
            const displayEl = document.getElementById('display-value');
            const num = parseInt(currentInputValue, 10) || 0;
            if (num < 0) {
                displayEl.className = "digital-font text-3xl font-bold text-rose-400 tracking-wider truncate pl-2";
                displayEl.innerText = `- ${Math.abs(num).toLocaleString('pt-BR')}`;
            } else {
                displayEl.className = "digital-font text-3xl font-bold text-emerald-400 tracking-wider truncate pl-2";
                displayEl.innerText = num.toLocaleString('pt-BR');
            }
        }

        function pressNumpad(val) {
            let current = parseInt(currentInputValue, 10) || 0;
            const isNegative = current < 0 || currentInputValue.startsWith('-');
            let rawStr = currentInputValue.replace('-', '');

            if (rawStr === "0") {
                rawStr = val;
            } else {
                if (rawStr.length < 8) {
                    rawStr += val;
                }
            }

            currentInputValue = isNegative ? `-${rawStr}` : rawStr;
            updateDisplay();
        }

        function clearNumpad() {
            currentInputValue = "0";
            updateDisplay();
        }

        function addQuickValue(amount) {
            let current = parseInt(currentInputValue, 10) || 0;
            current += amount;
            currentInputValue = current.toString();
            updateDisplay();
        }

        function renderPlayers() {
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';

            players.filter(p => p.active).forEach(player => {
                const c = COLOR_MAP[player.color];
                const isBankrupt = player.balance <= 0;

                grid.innerHTML += `
                    <div onclick="openPlayerModal('${player.id}')" 
                         class="bg-slate-900 border-2 ${c.border}/50 hover:${c.border} rounded-xl p-2.5 shadow-md cursor-pointer transition btn-active flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <span class="w-3 h-3 rounded-full ${c.bg} inline-block"></span>
                                <span class="font-bold text-xs text-slate-100 truncate max-w-[80px]">${player.name}</span>
                            </div>
                            <i class="fa-solid fa-ellipsis-vertical text-xs text-slate-500"></i>
                        </div>
                        <div class="mt-2">
                            <span class="text-[9px] text-slate-400 font-semibold uppercase block">Saldo</span>
                            <span class="digital-font font-bold text-sm ${isBankrupt ? 'text-rose-500' : 'text-emerald-400'}">
                                R$ ${player.balance.toLocaleString('pt-BR')}
                            </span>
                        </div>
                    </div>
                `;
            });
        }

        function updateSelectOptions() {
            const payerSelect = document.getElementById('select-payer');
            const receiverSelect = document.getElementById('select-receiver');

            let optionsHtml = '<option value="BANK">🏛️ Banco</option>';
            players.filter(p => p.active).forEach(p => {
                optionsHtml += `<option value="${p.id}">${COLOR_MAP[p.color].name} - ${p.name}</option>`;
            });

            payerSelect.innerHTML = optionsHtml;
            receiverSelect.innerHTML = optionsHtml;

            // Padrão: Banco -> Primeiro jogador
            payerSelect.value = 'BANK';
            const firstPlayer = players.find(p => p.active);
            if (firstPlayer) receiverSelect.value = firstPlayer.id;
        }

        function executeTransaction() {
            let amount = parseInt(currentInputValue, 10);
            let payerId = document.getElementById('select-payer').value;
            let receiverId = document.getElementById('select-receiver').value;

            if (!amount || amount === 0) {
                showToast("Digite um valor no visor!", "error");
                return;
            }

            // Tratamento se o valor no visor for negativo (ex: veio do Azar/Revés)
            if (amount < 0) {
                amount = Math.abs(amount);
                const temp = payerId;
                payerId = receiverId;
                receiverId = temp;
            }

            if (payerId === receiverId) {
                showToast("Escolha Pagador e Recebedor diferentes!", "error");
                return;
            }

            let payerName = "Banco";
            let receiverName = "Banco";

            if (payerId !== "BANK") {
                const payer = players.find(p => p.id === payerId);
                if (payer) {
                    payer.balance -= amount;
                    payerName = payer.name;
                }
            }

            if (receiverId !== "BANK") {
                const receiver = players.find(p => p.id === receiverId);
                if (receiver) {
                    receiver.balance += amount;
                    receiverName = receiver.name;
                }
            }

            history.unshift({
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                amount,
                payerId,
                payerName,
                receiverId,
                receiverName
            });

            showToast(`R$ ${amount.toLocaleString('pt-BR')}: ${payerName} ➔ ${receiverName}`, "success");
            currentInputValue = "0";
            updateDisplay();
            renderPlayers();
            saveToLocalStorage();
        }

        // --- MODAIS ---
        function openPlayerModal(playerId) {
            selectedModalPlayerId = playerId;
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            const c = COLOR_MAP[player.color];
            const badge = document.getElementById('modal-player-badge');
            badge.className = `w-7 h-7 rounded-lg flex items-center justify-center text-white font-bold text-xs ${c.bg}`;
            badge.innerText = player.name.substring(0, 2).toUpperCase();

            document.getElementById('modal-player-name').innerText = player.name;
            document.getElementById('modal-player-balance').innerText = `R$ ${player.balance.toLocaleString('pt-BR')}`;
            document.getElementById('modal-start-bonus').innerText = config.startBonus.toLocaleString('pt-BR');

            document.getElementById('player-modal').classList.remove('hidden');
        }

        function closePlayerModal() {
            document.getElementById('player-modal').classList.add('hidden');
        }

        function quickPassStart() {
            if (!selectedModalPlayerId) return;
            const player = players.find(p => p.id === selectedModalPlayerId);
            if (player) {
                player.balance += config.startBonus;
                history.unshift({
                    id: Date.now(),
                    timestamp: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                    amount: config.startBonus,
                    payerId: 'BANK',
                    payerName: 'Banco (Ponto de Partida)',
                    receiverId: player.id,
                    receiverName: player.name
                });
                showToast(`+R$ ${config.startBonus.toLocaleString('pt-BR')} para ${player.name}`, "success");
                renderPlayers();
                saveToLocalStorage();
                closePlayerModal();
            }
        }

        function selectAsPayerFromModal() {
            if (selectedModalPlayerId) {
                document.getElementById('select-payer').value = selectedModalPlayerId;
                closePlayerModal();
                showToast("Definido como Pagador!", "info");
            }
        }

        function selectAsReceiverFromModal() {
            if (selectedModalPlayerId) {
                document.getElementById('select-receiver').value = selectedModalPlayerId;
                closePlayerModal();
                showToast("Definido como Recebedor!", "info");
            }
        }

        function openCardModal() {
            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        function drawChanceCard() {
            const randomIndex = Math.floor(Math.random() * chanceCards.length);
            drawnCard = chanceCards[randomIndex];

            document.getElementById('card-text').innerText = drawnCard.text;
            const valueEl = document.getElementById('card-value-display');
            const badgeEl = document.getElementById('card-type-badge');
            const applyBtn = document.getElementById('btn-apply-card');

            if (drawnCard.type === 'sorte') {
                badgeEl.className = "px-3 py-1 rounded-full text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badgeEl.innerText = "Sorte! Receba do Banco";
                valueEl.className = "text-xl font-bold font-display text-emerald-400 mt-2";
                valueEl.innerText = `+ R$ ${Math.abs(drawnCard.value).toLocaleString('pt-BR')}`;
            } else {
                badgeEl.className = "px-3 py-1 rounded-full text-[10px] font-extrabold uppercase bg-rose-500/20 text-rose-300 border border-rose-500/30";
                badgeEl.innerText = "Revés! Pague ao Banco";
                valueEl.className = "text-xl font-bold font-display text-rose-400 mt-2";
                valueEl.innerText = `- R$ ${Math.abs(drawnCard.value).toLocaleString('pt-BR')}`;
            }

            valueEl.classList.remove('hidden');
            applyBtn.classList.remove('hidden');
        }

        function applyCardEffect() {
            if (drawnCard) {
                if (drawnCard.type === 'sorte') {
                    currentInputValue = Math.abs(drawnCard.value).toString();
                    document.getElementById('select-payer').value = 'BANK';
                } else {
                    currentInputValue = (-Math.abs(drawnCard.value)).toString();
                    document.getElementById('select-receiver').value = 'BANK';
                }
                updateDisplay();
                closeCardModal();
                showToast("Valor da carta aplicado no visor!", "info");
            }
        }

        function openHistoryModal() {
            renderHistoryList();
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            if (history.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Nenhuma transação registrada ainda.</p>`;
                return;
            }

            container.innerHTML = history.map(item => `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between text-xs">
                    <div>
                        <div class="font-bold text-slate-200">${item.payerName} ➔ ${item.receiverName}</div>
                        <div class="text-[10px] text-slate-500">${item.timestamp}</div>
                    </div>
                    <div class="digital-font font-bold text-emerald-400">
                        R$ ${item.amount.toLocaleString('pt-BR')}
                    </div>
                </div>
            `).join('');
        }

        function undoLastTransaction() {
            if (history.length === 0) {
                showToast("Sem transações para desfazer!", "error");
                return;
            }

            const last = history.shift();

            if (last.payerId !== "BANK") {
                const payer = players.find(p => p.id === last.payerId);
                if (payer) payer.balance += last.amount;
            }

            if (last.receiverId !== "BANK") {
                const receiver = players.find(p => p.id === last.receiverId);
                if (receiver) receiver.balance -= last.amount;
            }

            showToast("Última transação desfeita!", "info");
            renderHistoryList();
            renderPlayers();
            saveToLocalStorage();
        }

        function openSettingsModal() {
            document.getElementById('input-initial-balance').value = config.initialBalance;
            document.getElementById('input-start-bonus').value = config.startBonus;
            renderSettingsList();
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function renderSettingsList() {
            const container = document.getElementById('settings-players-list');
            container.innerHTML = players.map(p => `
                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full ${COLOR_MAP[p.color].bg}"></span>
                        <input type="text" value="${p.name}" onchange="updatePlayerName('${p.id}', this.value)" class="bg-slate-900 text-white px-2 py-1 rounded border border-slate-700 max-w-[120px]">
                    </div>
                    <label class="flex items-center gap-1.5 cursor-pointer text-slate-400 text-[11px]">
                        <input type="checkbox" ${p.active ? 'checked' : ''} onchange="togglePlayerActive('${p.id}', this.checked)" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0">
                        Ativo
                    </label>
                </div>
            `).join('');
        }

        function updatePlayerName(id, name) {
            const p = players.find(p => p.id === id);
            if (p && name.trim()) p.name = name.trim();
        }

        function togglePlayerActive(id, active) {
            const p = players.find(p => p.id === id);
            if (p) p.active = active;
        }

        function saveSettings() {
            config.initialBalance = parseInt(document.getElementById('input-initial-balance').value, 10) || 25000;
            config.startBonus = parseInt(document.getElementById('input-start-bonus').value, 10) || 2000;

            renderPlayers();
            updateSelectOptions();
            saveToLocalStorage();
            closeSettingsModal();
            showToast("Configurações salvas com sucesso!", "success");
        }

        function resetGame() {
            if (confirm("Deseja realmente reiniciar a partida? Todos os saldos voltarão ao padrão.")) {
                players.forEach(p => p.balance = config.initialBalance);
                history = [];
                currentInputValue = "0";
                updateDisplay();
                renderPlayers();
                updateSelectOptions();
                saveToLocalStorage();
                closeSettingsModal();
                showToast("Partida reiniciada!", "info");
            }
        }

        function showToast(msg, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = "bg-slate-800 border-slate-700 text-slate-200";
            if (type === "success") bg = "bg-emerald-950 border-emerald-700 text-emerald-200";
            if (type === "error") bg = "bg-rose-950 border-rose-700 text-rose-200";

            toast.className = `${bg} border px-3 py-2 rounded-xl text-xs font-semibold shadow-xl flex items-center justify-between transition-all duration-300`;
            toast.innerText = msg;

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function saveToLocalStorage() {
            localStorage.setItem('sbi_config', JSON.stringify(config));
            localStorage.setItem('sbi_players', JSON.stringify(players));
            localStorage.setItem('sbi_history', JSON.stringify(history));
        }

        function loadFromLocalStorage() {
            const savedConfig = localStorage.getItem('sbi_config');
            const savedPlayers = localStorage.getItem('sbi_players');
            const savedHistory = localStorage.getItem('sbi_history');

            if (savedConfig) config = JSON.parse(savedConfig);
            if (savedPlayers) players = JSON.parse(savedPlayers);
            if (savedHistory) history = JSON.parse(savedHistory);
        }
    </script>
</body>
</html>
